[project]
name = "kyb-contracts"
version = "0.1.0"
description = "Shared data formats for the KYB exception review system"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kyb_contracts"]
