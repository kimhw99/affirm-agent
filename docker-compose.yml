# Runs all services together. Copy .env.example to .env and fill it in first.
# So far: the database and the backend services; the review app joins with BEAC-15.
# The browser talks only to the gateway (docs/auth.md).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # db/init.sql reads these three when it creates each service's account.
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?set AUTH_DB_PASSWORD in .env}
      CASE_DB_PASSWORD: ${CASE_DB_PASSWORD:?set CASE_DB_PASSWORD in .env}
      AGENT_DB_PASSWORD: ${AGENT_DB_PASSWORD:?set AGENT_DB_PASSWORD in .env}
    volumes:
      # Runs once, the first time the container starts with an empty data volume.
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - db-data:/var/lib/postgresql/data
    ports:
      # Published on this machine only. 5432 is often taken by a local PostgreSQL.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432"
    healthcheck:
      # Over TCP, so it passes only once db/init.sql has run and the real server is up.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  case:
    build:
      context: .
      dockerfile: services/case/Dockerfile
    environment:
      CASE_DB_HOST: db
      CASE_DB_PORT: "5432"
      CASE_DB_PASSWORD: ${CASE_DB_PASSWORD:?set CASE_DB_PASSWORD in .env}
      CASE_SERVICE_TOKEN: ${CASE_SERVICE_TOKEN:?set CASE_SERVICE_TOKEN in .env}
    volumes:
      # For loading the golden cases from inside the container:
      #   docker compose run --rm case python seed.py
      - ./data/golden:/repo/data/golden:ro
    ports:
      # Published on this machine only; inside Docker Compose it's http://case:8000.
      - "127.0.0.1:${CASE_HOST_PORT:-8001}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    environment:
      AUTH_DB_HOST: db
      AUTH_DB_PORT: "5432"
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?set AUTH_DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_TTL_MINUTES: ${JWT_TTL_MINUTES:-480}
      DEMO_ANALYST_PASSWORD: ${DEMO_ANALYST_PASSWORD:-}
      DEMO_SENIOR_PASSWORD: ${DEMO_SENIOR_PASSWORD:-}
    # Not published: the browser reaches it through the gateway.
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

  agent:
    build:
      context: .
      dockerfile: services/agent/Dockerfile
    environment:
      CASE_SERVICE_URL: http://case:8000
      CASE_SERVICE_TOKEN: ${CASE_SERVICE_TOKEN:?set CASE_SERVICE_TOKEN in .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      LEAD_MODEL: ${LEAD_MODEL:-}
      LEAD_LLM: ${LEAD_LLM:-on}
      SEND_RESULTS: ${SEND_RESULTS:-1}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-https://cloud.langfuse.com}
    # Not published: it trusts X-User-Id and X-User-Role, which only the gateway may set.
    depends_on:
      case:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 20

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    environment:
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      CASE_SERVICE_TOKEN: ${CASE_SERVICE_TOKEN:?set CASE_SERVICE_TOKEN in .env}
      AUTH_SERVICE_URL: http://auth:8000
      CASE_SERVICE_URL: http://case:8000
      AGENT_SERVICE_URL: http://agent:8000
    ports:
      # The browser's only entry point, published on this machine only.
      - "127.0.0.1:${GATEWAY_HOST_PORT:-8080}:8000"
    depends_on:
      auth:
        condition: service_healthy
      case:
        condition: service_healthy
      agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
